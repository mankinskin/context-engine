title = "Fresh-clone bootstrap fails: memory-api submodule pinned to unreachable commit"
state = "done"
resolution = "Root cause confirmed: memory-api's pinned commit df2164aa was temporarily unreachable on the upstream remote (fixed upstream by repo owner). Re-ran full bootstrap after remote fix: setup_git.sh, install-deps.sh --dry-run, install-tools.sh --mcp --dry-run, init.sh, tools/verify-bootstrap.sh -> all pass. Found 2 additional issues during retry: (1) memory-viewers, viewer-api, and memory-kernel submodules had EMPTY working trees after initial clone (git status showed all tracked files as staged-deleted) -- recovered via 'git reset --hard HEAD' in each; likely caused by the aborted first bootstrap run interrupting submodule checkout. (2) install-tools.sh --mcp --dry-run mis-reports success=30/failed=0 even when 4 sub-builds actually error (cargo manifest load failures) -- the dry-run success accounting does not check the underlying cargo command's exit status. (3) init.sh invokes 'copilot init' when the copilot binary is on PATH, silently launching a nested interactive Copilot CLI session that spends AI credits and edits .github/copilot-instructions.md without confirmation -- surprising side effect for automated/CI bootstrap runs. Filed as follow-up observations; primary blocker (broken submodule pin) is resolved and full bootstrap now passes end-to-end with zero errors."
type = "bug"
