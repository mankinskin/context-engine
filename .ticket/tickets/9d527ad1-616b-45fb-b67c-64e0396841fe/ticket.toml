forward_handoff_package = "# Forward Handoff Package: 9d527ad1 (per-tool-call token-load telemetry)\n\n## Objective\n\nMake token-load telemetry non-zero for MCP tool traffic by recording real observed payload sizes and estimated token load from the `mcp-cost-gate` proxy. Coverage is partial BY DESIGN and that boundary must be stated in the data, not hidden. The consuming data model already exists and is committed under 41ff230b; this ticket supplies real source data for the subset that can be measured honestly.\n\n## Why the original plan was abandoned (verified, do not re-litigate)\n\nThree independent research passes established:\n\n- The raw Microsoft Copilot transcript JSONL (`%APPDATA%/Code/User/workspaceStorage/<workspace-id>/GitHub.copilot-chat/transcripts/*.jsonl`) contains NO `usage` object and no token fields under any spelling (checked usage, tokens, input_tokens, output_tokens, promptTokens, completionTokens, totalTokens, cache_read, cacheRead, cost, requestId) across 3 files.\n- The raw transcript ALSO has no `model` field. `session.start` carries only `producer: \\\"copilot-agent\\\"`, `copilotVersion: \\\"0.58.0\\\"`, `vscodeVersion: \\\"1.130.0\\\"`.\n- Therefore `hook/transcript.rs` (~line 171) hardcoding `model: None` is NOT the bug, and the extraction in `hook.rs` (~lines 251-272) is correct. The parser discards nothing that exists. Editing session-api alone CANNOT fix this.\n- **NEW THIS ITERATION**: MCP `tools/call` results carry no `usage` field; no repo MCP server emits one; `mcp-cost-gate`'s `proxy.rs` passes non-`tools/list` responses through untouched. Token counts are therefore NOT observable at the proxy. Having `caller_model` and a price table yields price-per-token, not token counts. The dollar-cost path is as blocked as the transcript path.\n- The producer is Microsoft's closed-source `GitHub.copilot` extension, unmodifiable from this repo. The only VS Code extension here is `memory-api/tools/ticket-vscode`, which does not touch Copilot capture.\n\nThe earlier plan (VS Code extension layer as producer + payload-level `model` fallback) is dead on both halves. The revised plan (compute dollar cost from proxy-observed MCP usage + price tables) is also dead: the proxy sees payloads, not usage. Do not attempt either.\n\n## Scope\n\nSource telemetry from `mcp-cost-gate`, which already sits in the MCP call path and already knows `CALLER_MODEL`.\n\n- Record real observed **payload size** (request and response byte/char counts) and **estimated token load** (derived via a fixed char-per-token divisor) for MCP tool traffic into the existing `SessionTurnEventMeta` -> `compute_subagent_rollups` path.\n- Mark coverage explicitly so partial data is never mistaken for complete data. A consumer must be able to distinguish \\\"no MCP traffic\\\" from \\\"telemetry unavailable\\\".\n- Do NOT compute dollar cost. Tools do not have a dollar cost; a tool call's only cost effect is the tokens it adds to the consuming agent's context, and the dollar cost arises there, in that agent's model billing.\n\n## Target Tickets\n\n- 9d527ad1-616b-45fb-b67c-64e0396841fe (bug, state `new`, no dependencies, ready to start)\n- 8ad2581e-d9c0-4d24-b913-2b5ee77b2eeb already has a `depends_on` edge to this ticket; the ordering is enforced by the graph and is confirmed to stand. It consumes this metadata/token-load stream.\n- Do not conflate with 8c67b96a (handoff record schema ownership).\n\n## Target Files\n\n- memory-api/tools/mcp/mcp-cost-gate/src/ — the proxy; primary site for emitting observed payload size and estimated token load.\n- memory-api/crates/session-api/src/subagent_rollup.rs — `compute_subagent_rollups`; verify aggregates become non-zero. No structural change expected.\n- memory-api/crates/session-api/src/store/config/persistence.rs — ~lines 273-282 compute `cost_usd` only when `model_id`, `input_tokens`, `output_tokens` are all `Some`. This gate stays as-is and keeps returning null at this boundary.\n- memory-api/crates/session-api/src/hook.rs — read-only reference for the existing extraction contract. Do not rewrite it.\n\n## Decisions\n\n1. **Tools do not have a dollar cost.** A tool call has no price of its own. Its only cost effect is the tokens it adds to the consuming agent's context, and the dollar cost arises there, in that agent's model billing. Therefore this ticket measures **token load of a tool call**, never a dollar figure.\n\n2. **No pricing, no cost field, in this ticket.** Do not compute `cost_usd`. Do not add `cost_usd_estimated`. Do not consult `tools/model-prices/model_prices.json` or the debug-log `models.json` price tables. The `cost_usd` gate in `memory-api/crates/session-api/src/store/config/persistence.rs` (~lines 273-282) stays untouched and keeps returning null at this boundary.\n\n3. **Record raw observed size plus an estimated token load.** At the `mcp-cost-gate` proxy, record per call: `timestamp`, `caller_model` (when supplied), tool name, `grant_id`, gate decision, request byte/char size, response byte/char size, `duration_ms`, and an estimated token load.\n\n4. **Estimation method: fixed char-per-token divisor** (chars/4) over the serialized request and response payloads. No tokenizer dependency. A rough empirical signal that is proportional to real token consumption is explicitly sufficient — this is the user's stated bar.\n\n5. The estimate must be **named and typed so it can never be read as an observed count or as a dollar cost** (e.g., `tokens_estimated`, derived from `chars`). The last iteration's blanket rejection of estimation is **reversed only for token load**, and remains in force for dollar cost.\n\n6. Partial coverage (MCP traffic only) remains accepted and must stay explicit in the data so \\\"no MCP traffic\\\" is distinguishable from \\\"telemetry unavailable\\\".\n\n7. HARD CONSTRAINT (standing, audited clean under 41ff230b): no shim, stub, fallback-to-zero, hardcoded value, or parallel code path may fabricate **dollar cost** data. Absent cost stays null. Honest absence beats fabricated precision. (Token estimation is explicitly exempt from this constraint under decision 5.)\n\n## Acceptance Criteria\n\n1. **AC1 (Observed payload size recorded)**: An MCP tool call records non-zero request and response byte/char counts in the proxy telemetry stream.\n\n2. **AC2 (Estimated token load recorded)**: The same MCP tool call records a non-zero `tokens_estimated` derived from the serialized payload character count (chars/4 divisor).\n\n3. **AC3 (Estimation is monotonic in payload size)**: Larger payloads yield larger `tokens_estimated`; the relationship is proportional.\n\n4. **AC4 (Non-MCP traffic records null, not zero)**: Traffic that does not flow through the `mcp-cost-gate` proxy records `null` for these fields rather than zero, preserving the honest-absence boundary.\n\n5. **AC5 (cost_usd remains null)**: The `cost_usd` field in `session-api` records remains `null` throughout; no dollar-cost computation occurs at this boundary.\n\n6. **AC6 (Partial coverage is explicit)**: The data model distinguishes \\\"no MCP traffic\\\" (zero tool calls) from \\\"telemetry unavailable\\\" (null fields for non-MCP paths).\n\n## Validation\n\n- val-session-api-lib-suite (required) — `cargo test -p session-api --lib`, currently 148 passing; must not regress.\n- val-session-api-build (required) — clean build of session-api.\n- New coverage required: a test proving an MCP tool call yields real non-zero `tokens_estimated` and byte/char counts in the rollup, and a test proving non-MCP traffic yields null rather than zero. Register these as new test-api validation specs with passing executions — the handoff record has no command field, so commands must live in `ValidationSpec.command`.\n\n## Non-Goals\n\n- No edits to `hook/transcript.rs` or `hook.rs` extraction logic; they are correct.\n- No attempt to modify or intercept Microsoft's Copilot extension.\n- No new repo-local VS Code extension in this ticket.\n- No tokenizer-based exact token counting.\n- No dollar-cost computation.\n- No price-table lookup (`tools/model-prices/model_prices.json` or debug-log `models.json`).\n- No changes to `QualityGate`/`QualityGatePhase`/`QualityGateOutcome` (41ff230b) or the satisfactory-work-rate query surface (spec 7be68a48 R3).\n- No backfill of historical sessions.\n- Handoff schema ownership is ticket 8c67b96a.\n\n## Context Anchors\n\n- Spec 7be68a48 — R4 rewritten this iteration to record the proxy limitation (observes payloads, not usage), the token-load-only measurement boundary, the estimation method, the partial-coverage boundary, and the no-dollar-cost constraint as normative. R1/R2/R3 unchanged.\n- Ticket 41ff230b (done) — consumer implementation, six verified acceptance criteria, no-shim audit clean.\n- Commits: memory-api submodule f8165b8; root a2b46eb6, 59f5fcb0, a658523e.\n- Handoff 9cd7050b supersedes dcf86212.\n- Prior art for the price gate: `CALLER_MODEL` plumbing and `evaluate()` in the mcp-cost-gate work.\n\n## Open Escalations\n\nNone. The upstream data gap (transcript and proxy both lack usage) was researched and confirmed; the mcp-cost-gate path, the token-load-only measurement, the chars/4 estimation method, the reversal of the estimation rejection for token load only, and the retained 8ad2581e ordering were all confirmed with the user this iteration."
