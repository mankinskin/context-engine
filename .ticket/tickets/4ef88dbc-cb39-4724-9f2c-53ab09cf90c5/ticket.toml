title = "Add a git-worktree helper script for the agent isolation protocol"
state = "done"
acceptance_criteria = "1. `new <short-id> <slug>` bootstraps a worktree per the fetch/checkout/pull/worktree-add sequence, initializes ALL 5 submodules (not just one), and prints the resolved worktree path and branch name. 2. `list` enumerates existing worktrees with their branches. 3. `rebase <name>` fetches origin and rebases the named worktree onto origin/main. 4. `merge <name>` performs a `--ff-only` merge into main and fails loudly (never falls back to a non-ff merge) when main has moved. 5. `remove <name>` runs teardown as exactly three steps -- `git worktree remove --force <path>`, `git worktree prune`, `git branch -d <branch>` -- and does NOT run `git submodule deinit` in this path. Corrected by commit 4909db52: running `git submodule deinit` inside a linked worktree rewrites `submodule.*` in the SHARED .git/config, silently deinitializing the MAIN checkout's submodules; `git worktree remove --force` already handles submodules per git's own docs (\"Unclean worktrees or ones with submodules can be removed with --force\"), so the deinit step was actively harmful and was removed. The only surviving `submodule deinit` call in the script is in the `new` bootstrap-failure rollback path (~line 204) -- that one is correct and intentional, and must NOT be removed. 6. `doctor` detects and repairs the case where the main checkout's submodules were silently deinitialized by an in-worktree `submodule deinit` (defense-in-depth against accidental or manual deinit, even though normal teardown no longer runs it). 7. Every mutating subcommand supports `--dry-run`, printing the commands it would run without executing them. 8. Every mutating subcommand refuses to run when invoked from inside a worktree rather than the main checkout. 9. .agents/agents/orchestrator.agent.md's teardown block is updated to include the missing `git worktree prune` step so it matches .agents/instructions/commit/branch-worktree.instructions.md. 10. The script is the canonical invocation for the agent isolation protocol across guidance: .agents/instructions/commit/branch-worktree.instructions.md (bootstrap, rebase, merge, teardown blocks, plus a `doctor` pointer and a 'run from the main checkout' note), .agents/agents/orchestrator.agent.md (bootstrap block; merge + teardown block), .agents/agents/implement.agent.md (states the worktree is provisioned by the orchestrator and arrives via the task context; this agent never runs `new`/`merge`/`remove` and never merges into `main`), .agents/instructions/commit/workflow.instructions.md (points at `worktree.sh list`), and AGENTS.md (one clause naming the helper) -- all now invoke `bash tools/worktree/worktree.sh <subcommand>` as the canonical form, with the raw git command sequence demoted to an explanatory fallback rather than a second source of truth. Landed in commits 377a6bd7 and 5c6ca32d, both on main. 11. `list` uses `git worktree list --porcelain` as the sole membership test, not directory enumeration under `.worktrees/*` combined with a per-directory branch lookup. A directory under `.worktrees/` that is not a registered worktree is reported as `UNREGISTERED-DEBRIS` with no branch name, never a fabricated branch; `doctor` reports such directories under an 'unregistered debris' line instead of claiming 'none stale'. This fixes a real defect: the old implementation resolved a non-member directory's branch from inside it, which silently fell through to the enclosing main checkout and printed a fabricated entry (observed as `4ef88dbc-protocol-fix branch=main`). Empirically verified: with a stray `.worktrees/zzz-orphan-test` present, the fixed script printed `zzz-orphan-test UNREGISTERED-DEBRIS -` where the old script printed `zzz-orphan-test branch=main`. 12. The full protocol -- `new`, commit, rebase, `merge --ff-only`, `remove` -- was dogfooded end to end on worktree `4ef88dbc-guidance-wiring`, after which all 5 submodules in the main checkout remained initialized and `doctor` reported healthy with no debris."
