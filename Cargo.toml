[workspace]
resolver = "2"
members = [
  "context-stack/context-search",
  "context-stack/context-insert",
  "context-stack/context-read",
  "context-stack/context-trace",
  "context-stack/context-trace-macros",
  "context-stack/context-api",
  "context-stack/ngrams",
  "context-stack/tools/cli/context-cli",
  "context-stack/tools/mcp/context-mcp",
  "context-stack/tools/http/context-http",
  "context-stack/tools/context-editor/kernel",
  "context-stack/tools/context-editor/sandbox-app",
  "memory-api/crates/memory-fixtures",
  "memory-api/crates/memory-matrix",
  "memory-api/tools/cli/compact-terminal-cli",
  "memory-api/tools/cli/fs-cli",
  "memory-api/tools/mcp/compact-terminal-mcp",
  "memory-api/tools/mcp/fs-mcp",
  "memory-api/crates/compact-terminal-api",
  "memory-api/crates/fs-api",
  "viewer-api",
  "viewer-api/frontend/dioxus",
  "tools/tracing-analyzer",
  "tools/dungeon-crawler",
  "tools/cli/crane-cli",
]

[profile.dev]
debug = true
opt-level = 0

[profile.release]
opt-level = 2 # fast and small wasm

[workspace.metadata.docs.rs]
no-deps = true

[patch."https://github.com/mankinskin/context-stack"]
context-api = { path = "context-stack/context-api" }
context-insert = { path = "context-stack/context-insert" }
context-read = { path = "context-stack/context-read" }
context-search = { path = "context-stack/context-search" }
context-trace = { path = "context-stack/context-trace" }
context-trace-macros = { path = "context-stack/context-trace-macros" }
ngrams = { path = "context-stack/ngrams" }

[patch."https://github.com/mankinskin/viewer-api"]
viewer-api = { path = "viewer-api" }

# The published memory-fixtures remote is behind the in-tree crate (missing
# empty_workspace/EmptyWorkspace); patch to the local copy until republished.
[patch."https://github.com/mankinskin/memory-fixtures"]
memory-fixtures = { path = "memory-api/crates/memory-fixtures" }
