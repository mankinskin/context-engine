[workspace]
resolver = "2"
members = [
  "context-stack/context-search",
  "context-stack/context-insert",
  "context-stack/context-read",
  "context-stack/context-trace",
  "context-stack/context-trace-macros",
  "context-stack/context-api",
  "context-stack/ngrams",
  "context-stack/tools/cli/context-cli",
  "context-stack/tools/mcp/context-mcp",
  "context-stack/tools/http/context-http",
  "context-stack/tools/context-editor/kernel",
  "context-stack/tools/context-editor/sandbox-app",
  "memory-api/crates/audit-api",
  "memory-api/crates/doc-api",
  "memory-api/crates/test-api",
  "memory-api/crates/log-api",
  "memory-api/crates/feedback-api",
  "memory-api/crates/memory-fixtures",
  "memory-api/crates/memory-matrix",
  "memory-api/tools/http/doc-http",
  "memory-api/tools/http/feedback-http",
  "memory-api/tools/cli/audit-cli",
  "memory-api/tools/cli/feedback-cli",
  "memory-api/tools/cli/test-cli",
  "memory-api/tools/mcp/audit-mcp",
  "memory-api/tools/mcp/test-mcp",
  "memory-api/tools/mcp/feedback-mcp",
  "memory-api/tools/cli/peek-cli",
  "memory-api/tools/cli/compact-terminal-cli",
  "memory-api/tools/cli/fs-cli",
  "memory-api/tools/mcp/peek-mcp",
  "memory-api/tools/mcp/compact-terminal-mcp",
  "memory-api/tools/mcp/fs-mcp",
  "memory-api/crates/peek-api",
  "memory-api/crates/compact-terminal-api",
  "memory-api/crates/fs-api",
  "memory-viewers/doc-viewer",
  "memory-viewers/log-viewer",
  "memory-viewers/log-viewer/frontend/dioxus",
  "workflow-tools/ticket/ticket-viewer",
  "workflow-tools/spec/spec-viewer",
  "workflow-tools/spec/spec-viewer/frontend/dioxus",
  "workflow-tools/ticket/ticket-viewer/frontend/dioxus",
  "workflow-tools/spec",
  "workflow-tools/ticket",
  "workflow-tools/rule",
  "workflow-tools/rule/crates/rule-api",
  "workflow-tools/session",
  "workflow-tools/session/crates/session-api",
  "workflow-tools/session/crates/session-worktree-provision",
  "workflow-tools/session/crates/session-record-merge",
  "workflow-tools/session/crates/session-workspace-resolver",
  "workflow-tools/session/crates/toolmon-policy-api",
  "workflow-tools/session/crates/toolmon-costgate",
  "workflow-tools/session/crates/mcp-toolmon",
  "workflow-tools/session/crates/worktree-ctl",
  "viewer-api",
  "viewer-api/frontend/dioxus",
  "tools/migrate-edges",
  "tools/install/install-ctl",
  "tools/tracing-analyzer",
  "tools/dungeon-crawler",
  "tools/cli/crane-cli",
]

[profile.dev]
debug = true
opt-level = 0

[profile.release]
opt-level = 2 # fast and small wasm

[workspace.metadata.docs.rs]
no-deps = true

# Local-development overrides so crates published from repos that are also
# checked out as submodules resolve to a single version instead of being
# duplicated once via `path` (in-tree members) and once via `git` (pulled in
# transitively by other extracted repos). Domain manifests keep their
# canonical git declarations; these patches are workspace composition only
# and must be removed to prove patch-free remote resolution.
[patch."https://github.com/mankinskin/memory-kernel"]
memory-kernel = { path = "memory-kernel" }
transport-harness = { path = "memory-kernel/crates/transport-harness" }

[patch."https://github.com/mankinskin/context-stack"]
context-api = { path = "context-stack/context-api" }
context-insert = { path = "context-stack/context-insert" }
context-read = { path = "context-stack/context-read" }
context-search = { path = "context-stack/context-search" }
context-trace = { path = "context-stack/context-trace" }
context-trace-macros = { path = "context-stack/context-trace-macros" }
ngrams = { path = "context-stack/ngrams" }

[patch."https://github.com/mankinskin/viewer-api"]
viewer-api = { path = "viewer-api" }

# The published memory-fixtures remote is behind the in-tree crate (missing
# empty_workspace/EmptyWorkspace); patch to the local copy until republished.
[patch."https://github.com/mankinskin/memory-fixtures"]
memory-fixtures = { path = "memory-api/crates/memory-fixtures" }

[patch."https://github.com/mankinskin/memory-api"]
doc-http = { path = "memory-api/tools/http/doc-http" }
feedback-api = { path = "memory-api/crates/feedback-api" }
feedback-http = { path = "memory-api/tools/http/feedback-http" }
test-api = { path = "memory-api/crates/test-api" }

[patch."https://github.com/mankinskin/ticket"]
ticket = { path = "workflow-tools/ticket" }
ticket-api = { path = "workflow-tools/ticket/crates/ticket-api" }

[patch."https://github.com/mankinskin/spec"]
spec = { path = "workflow-tools/spec" }
spec-api = { path = "workflow-tools/spec/crates/spec-api" }

[patch."https://github.com/mankinskin/rule"]
rule = { path = "workflow-tools/rule" }
rule-api = { path = "workflow-tools/rule/crates/rule-api" }

[patch."https://github.com/mankinskin/session"]
session = { path = "workflow-tools/session" }
session-api = { path = "workflow-tools/session/crates/session-api" }
session-worktree-provision = { path = "workflow-tools/session/crates/session-worktree-provision" }
session-workspace-resolver = { path = "workflow-tools/session/crates/session-workspace-resolver" }